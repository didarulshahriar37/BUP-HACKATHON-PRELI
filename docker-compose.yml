services:
  gridwise-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridwise-service
    ports:
      - "8000:3000"
    env_file:
      - path: env
        required: false
      - path: .env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\"" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
